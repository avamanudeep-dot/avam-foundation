<svg width="900" height="1000" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ec"/>
      <stop offset="100%" stop-color="#dcebd9"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a20"/>
      <stop offset="100%" stop-color="#241811"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a5e"/>
      <stop offset="100%" stop-color="#b8744a"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9eef2"/>
      <stop offset="100%" stop-color="#cfd9df"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1000" fill="url(#skyGrad)"/>
  <circle cx="480" cy="280" r="420" fill="url(#glow)"/>

  <!-- distant leaves / bokeh -->
  <g opacity="0.5">
    <circle cx="120" cy="150" r="10" fill="#9fc79a"/>
    <circle cx="780" cy="220" r="16" fill="#a9d0a3"/>
    <circle cx="90" cy="760" r="14" fill="#b7dab1"/>
    <circle cx="820" cy="820" r="10" fill="#9fc79a"/>
    <circle cx="700" cy="120" r="7" fill="#c8e3c3"/>
  </g>

  <!-- shoulders / shirt -->
  <path d="M230 1000 C230 760 340 640 450 640 C560 640 670 760 670 1000 Z" fill="url(#shirtGrad)"/>
  <path d="M330 700 C370 730 420 745 450 745 C480 745 530 730 570 700 L560 990 L340 990 Z" fill="#dfe6ea"/>

  <!-- neck -->
  <rect x="410" y="560" width="80" height="110" rx="30" fill="url(#skinGrad)"/>

  <!-- head -->
  <ellipse cx="450" cy="470" rx="150" ry="165" fill="url(#skinGrad)"/>

  <!-- ears -->
  <ellipse cx="300" cy="480" rx="18" ry="26" fill="#b8744a"/>
  <ellipse cx="600" cy="480" rx="18" ry="26" fill="#b8744a"/>

  <!-- hair -->
  <path d="M300 420 C280 300 350 230 450 225 C555 228 625 300 605 425 C605 350 560 300 450 300 C345 300 300 355 300 420 Z" fill="url(#hairGrad)"/>
  <path d="M300 430 C295 470 300 520 320 560 C300 500 300 450 305 415 Z" fill="url(#hairGrad)"/>
  <path d="M600 430 C605 470 600 520 580 560 C600 500 600 450 595 415 Z" fill="url(#hairGrad)"/>

  <!-- eyebrows -->
  <path d="M370 440 Q400 425 430 440" stroke="#241811" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M470 440 Q500 425 530 440" stroke="#241811" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- eyes looking up -->
  <ellipse cx="400" cy="465" rx="20" ry="14" fill="#ffffff"/>
  <ellipse cx="500" cy="465" rx="20" ry="14" fill="#ffffff"/>
  <circle cx="404" cy="458" r="9" fill="#2b2118"/>
  <circle cx="504" cy="458" r="9" fill="#2b2118"/>
  <circle cx="407" cy="455" r="2.5" fill="#fff"/>
  <circle cx="507" cy="455" r="2.5" fill="#fff"/>

  <!-- nose -->
  <path d="M448 480 Q440 505 452 515 Q460 517 466 512" stroke="#9a5c37" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M395 545 Q450 585 505 545" stroke="#7a3f26" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M410 552 Q450 572 490 552 Q450 590 410 552 Z" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="365" cy="510" rx="20" ry="12" fill="#e3a479" opacity="0.55"/>
  <ellipse cx="535" cy="510" rx="20" ry="12" fill="#e3a479" opacity="0.55"/>

  <!-- backpack strap -->
  <path d="M330 700 L300 960" stroke="#4d8f55" stroke-width="26" stroke-linecap="round"/>
  <path d="M330 700 L300 960" stroke="#3f7947" stroke-width="10" stroke-linecap="round"/>
</svg>
